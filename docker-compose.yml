services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: walkwithgod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["wwg-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d walkwithgod"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/walkwithgod
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: replace-with-a-long-random-secret-before-production
      FRONTEND_URL: http://localhost:4200
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  wwg-postgres:
