spring:
  application:
    name: walk-with-god-api
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:walkwithgod}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  bible:
    api-url: ${BIBLE_API_URL:https://rest.api.bible/v1}
    api-key: ${BIBLE_API_KEY:}
  media:
    storage-root: ${MEDIA_STORAGE_ROOT:./uploads}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:10485760}
    max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:26214400}
    max-video-seconds: ${MEDIA_MAX_VIDEO_SECONDS:60}
    min-image-dimension: ${MEDIA_MIN_IMAGE_DIM:100}
    max-image-dimension: ${MEDIA_MAX_IMAGE_DIM:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true